name: Compilar Firmware ESP32

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Instalar Arduino CLI
        run: |
          curl -fsSL https://raw.githubusercontent.com/arduino/arduino-cli/master/install.sh | sh
          sudo mv bin/arduino-cli /usr/local/bin/

      - name: Instalar Core ESP32
        run: |
          arduino-cli config init
          arduino-cli config add board_manager.additional_urls https://raw.githubusercontent.com/espressif/arduino-esp32/gh-pages/package_esp32_index.json
          arduino-cli core update-index
          arduino-cli core install esp32:esp32

      - name: Compilar Sketch
        run: |
          arduino-cli compile --fqbn esp32:esp32:esp32cam esp32cam-stream --output-dir ./build

      - name: Subir Binarios Compilados
        uses: actions/upload-artifact@v4
        with:
          name: firmware-esp32
          path: ./build/*.bin
